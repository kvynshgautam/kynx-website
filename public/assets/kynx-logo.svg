<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Outer Hex-Shield Gradient -->
    <linearGradient id="shieldFill" x1="14" y1="6" x2="106" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#1A2333" />
      <stop offset="0.5" stop-color="#0F1522" />
      <stop offset="1.0" stop-color="#090D15" />
    </linearGradient>

    <!-- Metallic Chamfer Border Gradient -->
    <linearGradient id="borderGrad" x1="14" y1="6" x2="106" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#E2E8F0" />
      <stop offset="0.3" stop-color="#6366F1" />
      <stop offset="0.7" stop-color="#38BDF8" />
      <stop offset="1.0" stop-color="#475569" />
    </linearGradient>

    <!-- Stem of K (Left Pillar) -->
    <linearGradient id="stemGrad" x1="38" y1="32" x2="49" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#F8FAFC" />
      <stop offset="0.5" stop-color="#CBD5E1" />
      <stop offset="1.0" stop-color="#818CF8" />
    </linearGradient>

    <!-- Upper Wing of K -->
    <linearGradient id="upperWingGrad" x1="48" y1="32" x2="87" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#E2E8F0" />
      <stop offset="0.6" stop-color="#818CF8" />
      <stop offset="1.0" stop-color="#6366F1" />
    </linearGradient>

    <!-- Lower Wing of K -->
    <linearGradient id="lowerWingGrad" x1="46" y1="56" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0.0" stop-color="#6366F1" />
      <stop offset="0.5" stop-color="#4F46E5" />
      <stop offset="1.0" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hex-Shield Base with Dark Metallic Fill -->
  <path d="M60,6 L106,28 L106,92 L60,114 L14,92 L14,28 Z" fill="url(#shieldFill)" />

  <!-- Metallic Chamfer Border with Glow -->
  <path d="M60,6 L106,28 L106,92 L60,114 L14,92 L14,28 Z" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Inner Subtle Shading Line -->
  <path d="M60,14 L98,33 L98,87 L60,106 L22,87 L22,33 Z" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.8" />

  <!-- 3D Metallic Stem of K (Left Pillar) -->
  <path d="M38,32 L49,32 L49,88 L38,88 Z" fill="url(#stemGrad)" />

  <!-- Upper Wing of K (Upper Diagonal) -->
  <path d="M48,58 L74,32 L87,32 L58,60 Z" fill="url(#upperWingGrad)" />

  <!-- Lower Wing of K (Lower Diagonal with 3D Depth Facet) -->
  <path d="M54,56 L88,88 L74,88 L46,62 Z" fill="url(#lowerWingGrad)" />

  <!-- Center Gem Highlight -->
  <path d="M49,54 L58,60 L49,66 Z" fill="#FFFFFF" />
</svg>
